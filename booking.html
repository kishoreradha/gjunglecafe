<section class="booking-section">

    <h1>Book Your Event</h1>

    <p>
        Birthday Parties, Family Gatherings,
        Corporate Events and Special Occasions
    </p>

    <form class="booking-form">

        <label>Name</label>
        <input type="text" id="name">

        <label>Phone</label>
        <input type="text" id="phone">

        <label>Email</label>
        <input type="email" id="email">

        <label>Event Type</label>
        <select id="eventType">
            <option>Birthday Party</option>
            <option>Family Gathering</option>
            <option>Corporate Event</option>
            <option>Karaoke Room Reservation</option>
            <option>Private Function</option>
        </select>

        <label>Event Date</label>
        <input type="date" id="eventDate">

        <label>Number of Guests</label>
        <input type="number" id="guests">

        <label>Special Requests</label>
        <textarea id="remarks"></textarea>

    </form>

    <button class="whatsapp-btn" onclick="sendWhatsApp()">
        Send via WhatsApp
    </button>

    <button class="email-btn" onclick="sendEmail()">
        Send via Email
    </button>


</section>






<script>

function sendWhatsApp(){

    let name =
        document.getElementById("name").value;

    let phone =
        document.getElementById("phone").value;

    let email =
        document.getElementById("email").value;

    let eventType =
        document.getElementById("eventType").value;

    let eventDate =
        document.getElementById("eventDate").value;

    let guests =
        document.getElementById("guests").value;

    let remarks =
        document.getElementById("remarks").value;

    let message =
`Hello G' Jungle Cafe,

BOOKING REQUEST

Name: ${name}
Phone: ${phone}
Email: ${email}

Event Type: ${eventType}
Event Date: ${eventDate}
Guests: ${guests}

Remarks:
${remarks}`;

    let url =
"https://wa.me/639544871568?text=" +
encodeURIComponent(message);

    window.open(url, "_blank");
}

</script>
